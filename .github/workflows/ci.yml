name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  core:
    name: Núcleo (motor CLT, AFD/AEJ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.5"
      - working-directory: packages/pontomax_core
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib test || echo "::warning::Formatação divergente"
          dart analyze --fatal-infos
          dart test

  backend:
    name: API (integração com PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pontomax
          POSTGRES_PASSWORD: pontomax
          POSTGRES_DB: pontomax_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pontomax" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.5"
      - working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://pontomax:pontomax@localhost:5432/pontomax_test
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test -j 1

  app:
    name: App Flutter (análise, testes e build web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --base-href /app/ --no-web-resources-cdn --no-wasm-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: pontomax-web
          path: app/build/web
          retention-days: 7

  e2e:
    name: E2E (Playwright no app web)
    runs-on: ubuntu-latest
    needs: app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pontomax
          POSTGRES_PASSWORD: pontomax
          POSTGRES_DB: pontomax
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pontomax" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.5"
      - uses: actions/download-artifact@v4
        with:
          name: pontomax-web
          path: app/build/web
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sobe a API com dados de demonstração
        working-directory: backend
        env:
          DATABASE_URL: postgres://pontomax:pontomax@localhost:5432/pontomax
          JWT_SECRET: e2e-secret
          SEED_DEMO: "true"
          PORT: "8080"
          WEB_DIR: ${{ github.workspace }}/app/build/web
          SITE_DIR: ${{ github.workspace }}/site
          FONTS_DIR: ${{ github.workspace }}/backend/assets/fonts
          STORAGE_DIR: /tmp/pontomax-storage
        run: |
          dart pub get
          mkdir -p build && dart compile exe bin/server.dart -o build/server
          nohup ./build/server > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/v1/health && break; sleep 1; done
      - name: Playwright
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test
      - if: failure()
        run: cat /tmp/server.log | tail -100
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-falhas
          path: e2e/test-results
          if-no-files-found: ignore

  expo:
    name: Expo Go (tipos e bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo export --platform android --output-dir /tmp/expo-export

  android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_URL=${{ vars.PONTOMAX_API_URL || 'https://pontomax.app' }}
      - uses: actions/upload-artifact@v4
        with:
          name: pontomax-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: [core, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pontomax:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
