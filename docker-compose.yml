# Ambiente completo: PostgreSQL + PontoMax (API, app web em /app e site em /).
# Uso: docker compose up -d  →  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pontomax
      POSTGRES_USER: pontomax
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pontomax}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontomax"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://pontomax:${DB_PASSWORD:-pontomax}@db:5432/pontomax
      # Opcional: sem ele, um segredo aleatório é gerado e guardado no volume.
      JWT_SECRET: ${JWT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SEED_DEMO: ${SEED_DEMO:-false}
      REP_INPI_NUMBER: ${REP_INPI_NUMBER:-}
      REP_DEVELOPER_CNPJ: ${REP_DEVELOPER_CNPJ:-}
      # Certificado A1: coloque o .pfx em ./certs e use SIGNING_CERT_PATH=/srv/certs/arquivo.pfx
      SIGNING_CERT_PATH: ${SIGNING_CERT_PATH:-}
      SIGNING_CERT_PASSWORD: ${SIGNING_CERT_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-PontoMax <nao-responda@pontomax.app>}
      PONTOMAX_ENV: production
    volumes:
      - storage:/srv/storage
      - ./certs:/srv/certs:ro

volumes:
  db-data:
  storage:
