name: Release multiplataforma

# Gera os instaladores de todas as plataformas. Dispare manualmente ou
# publique uma tag v*. Defina a variável de repositório PONTOMAX_API_URL
# com o endereço público da API.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  FLUTTER_VERSION: "3.47.6"
  API_URL: ${{ vars.PONTOMAX_API_URL || 'https://pontomax.app' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: android, os: ubuntu-latest, cmd: "flutter build appbundle --release && flutter build apk --release --split-per-abi", out: "build/app/outputs" }
          - { target: web, os: ubuntu-latest, cmd: "flutter build web --release --base-href /app/ --no-web-resources-cdn --no-wasm-dry-run", out: "build/web" }
          - { target: linux, os: ubuntu-latest, cmd: "flutter build linux --release", out: "build/linux/x64/release/bundle" }
          - { target: windows, os: windows-latest, cmd: "flutter build windows --release", out: "build/windows/x64/runner/Release" }
          - { target: macos, os: macos-latest, cmd: "flutter build macos --release", out: "build/macos/Build/Products/Release" }
          - { target: ios, os: macos-latest, cmd: "flutter build ios --release --no-codesign", out: "build/ios/iphoneos" }
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        shell: bash
        run: |
          flutter pub get
          ${{ matrix.cmd }} --dart-define=API_URL=$API_URL
      - uses: actions/upload-artifact@v4
        with:
          name: pontomax-${{ matrix.target }}
          path: app/${{ matrix.out }}
