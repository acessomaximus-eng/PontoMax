name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  core:
    name: Núcleo (motor CLT, AFD/AEJ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.5"
      - working-directory: packages/pontomax_core
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib test || echo "::warning::Formatação divergente"
          dart analyze --fatal-infos
          dart test

  backend:
    name: API (integração com PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pontomax
          POSTGRES_PASSWORD: pontomax
          POSTGRES_DB: pontomax_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pontomax" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.5"
      - working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://pontomax:pontomax@localhost:5432/pontomax_test
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test -j 1

  app:
    name: App Flutter (análise, testes e build web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release --base-href /app/ --no-web-resources-cdn --no-wasm-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: pontomax-web
          path: app/build/web
          retention-days: 7

  android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --dart-define=API_URL=${{ vars.PONTOMAX_API_URL || 'https://pontomax.app' }}
      - uses: actions/upload-artifact@v4
        with:
          name: pontomax-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: [core, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pontomax:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
